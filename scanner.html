<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1520">
<title>Escáner · El Miarma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0f1520;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}

#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#1a2235;border-bottom:1px solid #263047;flex-shrink:0;
}
#logo{font-weight:800;font-size:15px;color:#f59e0b}

#mode-bar{
  display:flex;gap:0;flex-shrink:0;
  background:#0f1520;border-bottom:1px solid #263047;
}
.mode-btn{
  flex:1;padding:14px 8px;border:none;cursor:pointer;font-size:14px;font-weight:700;
  background:transparent;color:#475569;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.mode-btn.active-venta{color:#60a5fa;border-bottom:3px solid #60a5fa;background:#1e3a5f22}
.mode-btn.active-inventario{color:#4ade80;border-bottom:3px solid #4ade80;background:#14532d22}
.mode-btn:not(.active-venta):not(.active-inventario){border-bottom:3px solid transparent}

#cam-wrap{
  flex:1;position:relative;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
#cam-video{width:100%;height:100%;object-fit:cover;display:block}
#cam-overlay{
  position:absolute;inset:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
#scan-frame{
  width:72%;max-width:290px;aspect-ratio:2.2/1;
  border:2.5px solid rgba(245,158,11,.85);border-radius:12px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.42);
  transition:border-color .15s,box-shadow .15s;
}
#scan-frame.ok-venta{border-color:#60a5fa;box-shadow:0 0 0 9999px rgba(0,0,0,.42),0 0 24px rgba(96,165,250,.55)}
#scan-frame.ok-inventario{border-color:#4ade80;box-shadow:0 0 0 9999px rgba(0,0,0,.42),0 0 24px rgba(74,222,128,.55)}
#corners{position:absolute;inset:0;pointer-events:none}
.corner{position:absolute;width:22px;height:22px;border-color:#f59e0b;border-style:solid}
.corner.tl{top:24%;left:13%;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.corner.tr{top:24%;right:13%;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.corner.bl{bottom:24%;left:13%;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.corner.br{bottom:24%;right:13%;border-width:0 3px 3px 0;border-radius:0 0 4px 0}

#no-cam{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:24px;color:#64748b;
}
#no-cam .icon{font-size:48px}
#no-cam strong{color:#f59e0b;font-size:16px}

#footer{
  background:#1a2235;border-top:1px solid #263047;
  padding:12px 16px 18px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;
}
#status{
  text-align:center;font-size:14px;font-weight:600;
  color:#64748b;min-height:20px;transition:color .2s;
}
#status.ok{color:#4ade80}
#status.err{color:#f87171}

#scans-wrap{max-height:76px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.scan-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;background:#0f1520;border-radius:8px;
}
.scan-code{font-family:monospace;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan-code.cv{color:#60a5fa}
.scan-code.ci{color:#4ade80}
.scan-ts{font-size:10px;color:#475569;flex-shrink:0}
.scan-lbl{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;flex-shrink:0}
.scan-lbl.lv{background:#1e3a5f;color:#60a5fa}
.scan-lbl.li{background:#14532d;color:#4ade80}

#manual-row{display:flex;gap:8px;align-items:center}
#manual-inp{
  flex:1;padding:10px 12px;border-radius:10px;
  background:#0f1520;border:1.5px solid #263047;color:#fff;
  font-size:15px;outline:none;transition:border-color .15s;
}
#manual-inp:focus{border-color:#f59e0b}
#manual-inp::placeholder{color:#475569}
#manual-btn{
  padding:10px 16px;border-radius:10px;flex-shrink:0;
  background:#f59e0b;color:#000;border:none;font-size:14px;font-weight:700;
  cursor:pointer;
}
</style>
</head>
<body style="display:flex;flex-direction:column;height:100%">

<div id="header">
  <span id="logo">🌶️ El Miarma — Escáner</span>
</div>

<!-- Botones de modo -->
<div id="mode-bar">
  <button class="mode-btn" id="btn-venta" onclick="setMode('venta')">🛒 Venta</button>
  <button class="mode-btn" id="btn-inventario" onclick="setMode('inventario')">📦 Inventario</button>
</div>

<div id="cam-wrap">
  <video id="cam-video" autoplay playsinline muted></video>
  <div id="cam-overlay">
    <div id="scan-frame"></div>
    <div id="corners">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
    </div>
  </div>
  <div id="no-cam">
    <div class="icon">📷</div>
    <strong>Cámara no disponible</strong>
    <p>Usa Chrome en Android.<br>Introduce el código manualmente:</p>
  </div>
</div>

<div id="footer">
  <div id="status">Iniciando cámara...</div>
  <div id="scans-wrap"></div>
  <div id="manual-row">
    <input id="manual-inp" type="text" inputmode="numeric" placeholder="Código manual..." autocomplete="off">
    <button id="manual-btn" onclick="enviarManual()">Enviar</button>
  </div>
</div>

<script>
const SB_URL='https://aqbdlvmfbdagypmwxhca.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxYmRsdm1mYmRhZ3lwbXd4aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODM0NjIsImV4cCI6MjEwMzE1OTQ2Mn0.14wGoy4AQXhu9ZBTz4IAKBUXvRqveQZ1z-OKAMjm4gE';
const SB_H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

const params=new URLSearchParams(location.search);
const SESSION=params.get('s')||'';
let currentMode=params.get('m')||'venta';

const video=document.getElementById('cam-video');
const frame=document.getElementById('scan-frame');
const statusEl=document.getElementById('status');
const scansWrap=document.getElementById('scans-wrap');
const noCam=document.getElementById('no-cam');

function setMode(m){
  currentMode=m;
  document.getElementById('btn-venta').className='mode-btn'+(m==='venta'?' active-venta':'');
  document.getElementById('btn-inventario').className='mode-btn'+(m==='inventario'?' active-inventario':'');
  statusEl.textContent=m==='venta'?'Modo Venta — apunta al código':'Modo Inventario — apunta al código';
  statusEl.className='';
}
setMode(currentMode);
if(currentMode==='inventario'){
  document.getElementById('btn-venta').style.display='none';
}

let lastCode='',lastTs=0;
const COOLDOWN=3000;
let _bloqueado=false;

function setStatus(msg,cls=''){statusEl.textContent=msg;statusEl.className=cls;}

async function enviar(code){
  if(!SESSION){setStatus('⚠️ QR inválido — regenera el código desde la app','err');return;}
  if(_bloqueado)return;
  const now=Date.now();
  if(code===lastCode&&now-lastTs<COOLDOWN)return;
  lastCode=code;lastTs=now;
  _bloqueado=true;
  const payload=currentMode+':'+code;
  try{
    const r=await fetch(SB_URL+'/rest/v1/escaneos',{
      method:'POST',headers:SB_H,
      body:JSON.stringify({session_id:SESSION,barcode:payload})
    });
    if(r.ok||r.status===201){
      const isV=currentMode==='venta';
      setStatus('✓ '+code,'ok');
      try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}
      frame.className='ok-'+(isV?'venta':'inventario');
      addRow(code,currentMode);
      // Bloqueo visual de 3 segundos antes de permitir el siguiente escaneo
      let t=3;
      const iv=setInterval(()=>{
        t--;
        if(t>0){setStatus('⏳ Siguiente en '+t+'s...');}
        else{clearInterval(iv);_bloqueado=false;frame.className='';setMode(currentMode);}
      },1000);
    }else{
      setStatus('⚠️ Error al enviar ('+r.status+')','err');
      _bloqueado=false;
    }
  }catch(e){
    setStatus('⚠️ Sin conexión','err');
    _bloqueado=false;
  }
}

function addRow(code,mode){
  const t=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const isV=mode==='venta';
  const el=document.createElement('div');
  el.className='scan-row';
  el.innerHTML=`<span class="scan-lbl ${isV?'lv':'li'}">${isV?'V':'I'}</span><span class="scan-code ${isV?'cv':'ci'}">${code}</span><span class="scan-ts">${t}</span>`;
  scansWrap.prepend(el);
  if(scansWrap.children.length>4)scansWrap.lastChild.remove();
}

function enviarManual(){
  const inp=document.getElementById('manual-inp');
  const code=(inp.value||'').trim();
  if(!code){setStatus('Introduce un código','err');return;}
  enviar(code);inp.value='';
}
document.getElementById('manual-inp').addEventListener('keydown',e=>{if(e.key==='Enter')enviarManual();});

async function initCamera(){
  if(!('BarcodeDetector' in window)){
    noCam.style.display='flex';video.style.display='none';
    document.getElementById('cam-overlay').style.display='none';
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream;
    const detector=new BarcodeDetector({
      formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','data_matrix','codabar']
    });
    setInterval(async()=>{
      if(video.readyState<2)return;
      try{const codes=await detector.detect(video);if(codes.length)await enviar(codes[0].rawValue);}
      catch(e){}
    },300);
  }catch(e){
    noCam.style.display='flex';video.style.display='none';
    document.getElementById('cam-overlay').style.display='none';
    setStatus('Permite el acceso a la cámara','err');
  }
}

if(!SESSION){setStatus('⚠️ QR inválido — regenera el código','err');}
else{initCamera();}
</script>
</body>
</html>
