<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1520">
<title>Escáner · El Miarma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0f1520;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}

#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#1a2235;
  border-bottom:1px solid #263047;flex-shrink:0;
}
#logo{font-weight:800;font-size:16px;color:#f59e0b;letter-spacing:-.3px}
#mode-badge{
  font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:5px 12px;border-radius:99px;
}
#mode-badge.venta{background:#1e3a5f;color:#60a5fa}
#mode-badge.inventario{background:#14532d;color:#4ade80}

#cam-wrap{
  flex:1;position:relative;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
#cam-video{width:100%;height:100%;object-fit:cover;display:block}
#cam-overlay{
  position:absolute;inset:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
#scan-frame{
  width:72%;max-width:290px;aspect-ratio:2.2/1;
  border:2.5px solid rgba(245,158,11,.85);border-radius:12px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.42);
  transition:border-color .15s,box-shadow .15s;
}
#scan-frame.ok{
  border-color:#22c55e;
  box-shadow:0 0 0 9999px rgba(0,0,0,.42),0 0 24px rgba(34,197,94,.55);
}
#corners{position:absolute;inset:0;pointer-events:none}
.corner{
  position:absolute;width:22px;height:22px;
  border-color:#f59e0b;border-style:solid;
}
.corner.tl{top:24%;left:13%;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.corner.tr{top:24%;right:13%;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.corner.bl{bottom:24%;left:13%;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.corner.br{bottom:24%;right:13%;border-width:0 3px 3px 0;border-radius:0 0 4px 0}

#no-cam{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:24px;color:#64748b;
}
#no-cam .icon{font-size:48px}
#no-cam strong{color:#f59e0b;font-size:16px}

#footer{
  background:#1a2235;border-top:1px solid #263047;
  padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;
}
#status{
  text-align:center;font-size:14px;font-weight:600;
  color:#64748b;min-height:20px;transition:color .2s;
}
#status.ok{color:#4ade80}
#status.err{color:#f87171}
#status.wait{color:#94a3b8}

#scans-wrap{max-height:84px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.scan-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;background:#0f1520;border-radius:8px;
}
.scan-code{font-family:monospace;font-size:12px;color:#f59e0b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan-ts{font-size:10px;color:#475569;flex-shrink:0}

#manual-row{display:flex;gap:8px;align-items:center}
#manual-inp{
  flex:1;padding:11px 14px;border-radius:10px;
  background:#0f1520;border:1.5px solid #263047;color:#fff;
  font-size:15px;outline:none;transition:border-color .15s;
}
#manual-inp:focus{border-color:#f59e0b}
#manual-inp::placeholder{color:#475569}
#manual-btn{
  padding:11px 18px;border-radius:10px;flex-shrink:0;
  background:#f59e0b;color:#000;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .15s;
}
#manual-btn:active{opacity:.8}
</style>
</head>
<body style="display:flex;flex-direction:column;height:100%">

<div id="header">
  <span id="logo">🌶️ El Miarma</span>
  <span id="mode-badge">Venta</span>
</div>

<div id="cam-wrap">
  <video id="cam-video" autoplay playsinline muted></video>
  <div id="cam-overlay">
    <div id="scan-frame"></div>
    <div id="corners">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
  </div>
  <div id="no-cam">
    <div class="icon">📷</div>
    <strong>Cámara no disponible</strong>
    <p>Usa Chrome en Android.<br>Introduce el código manualmente:</p>
  </div>
</div>

<div id="footer">
  <div id="status" class="wait">Iniciando cámara...</div>
  <div id="scans-wrap"></div>
  <div id="manual-row">
    <input id="manual-inp" type="text" inputmode="numeric" placeholder="Código de barras manual..." autocomplete="off">
    <button id="manual-btn" onclick="enviarManual()">Enviar</button>
  </div>
</div>

<script>
const SB_URL='https://aqbdlvmfbdagypmwxhca.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxYmRsdm1mYmRhZ3lwbXd4aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODM0NjIsImV4cCI6MjEwMzE1OTQ2Mn0.14wGoy4AQXhu9ZBTz4IAKBUXvRqveQZ1z-OKAMjm4gE';
const SB_H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

const p=new URLSearchParams(location.search);
const SESSION=p.get('s')||'';
const MODE=p.get('m')||'venta';

// Mode badge
const badge=document.getElementById('mode-badge');
badge.textContent=MODE==='inventario'?'Inventario':'Venta';
badge.className=MODE==='inventario'?'inventario':'venta';

const video=document.getElementById('cam-video');
const frame=document.getElementById('scan-frame');
const statusEl=document.getElementById('status');
const scansWrap=document.getElementById('scans-wrap');
const noCam=document.getElementById('no-cam');

let lastCode='',lastTs=0;

function setStatus(msg,cls='wait'){
  statusEl.textContent=msg;statusEl.className=cls;
}

async function enviar(code){
  if(!SESSION){setStatus('⚠️ QR inválido — regenera el código desde la app','err');return;}
  const now=Date.now();
  if(code===lastCode&&now-lastTs<2000)return;
  lastCode=code;lastTs=now;
  try{
    const r=await fetch(SB_URL+'/rest/v1/escaneos',{
      method:'POST',headers:SB_H,
      body:JSON.stringify({session_id:SESSION,barcode:code})
    });
    if(r.ok||r.status===201){
      setStatus('✓ Enviado: '+code,'ok');
      try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}
      frame.classList.add('ok');
      setTimeout(()=>frame.classList.remove('ok'),600);
      addRow(code);
      setTimeout(()=>setStatus('Apunta al siguiente código','wait'),1800);
    }else{
      setStatus('⚠️ Error al enviar ('+r.status+')','err');
    }
  }catch(e){
    setStatus('⚠️ Sin conexión a internet','err');
  }
}

function addRow(code){
  const t=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const el=document.createElement('div');
  el.className='scan-row';
  el.innerHTML=`<span class="scan-code">${code}</span><span class="scan-ts">${t}</span>`;
  scansWrap.prepend(el);
  if(scansWrap.children.length>4)scansWrap.lastChild.remove();
}

function enviarManual(){
  const inp=document.getElementById('manual-inp');
  const code=(inp.value||'').trim();
  if(!code){setStatus('Introduce un código','err');return;}
  enviar(code);inp.value='';
}
document.getElementById('manual-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter')enviarManual();
});

async function initCamera(){
  if(!('BarcodeDetector' in window)){
    noCam.style.display='flex';
    video.style.display='none';
    document.getElementById('cam-overlay').style.display='none';
    setStatus('Introduce el código manualmente','wait');
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream;
    setStatus('Apunta al código de barras...','wait');
    const detector=new BarcodeDetector({
      formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','data_matrix','codabar']
    });
    setInterval(async()=>{
      if(video.readyState<2)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length)await enviar(codes[0].rawValue);
      }catch(e){}
    },300);
  }catch(e){
    noCam.style.display='flex';
    video.style.display='none';
    document.getElementById('cam-overlay').style.display='none';
    setStatus('Permite el acceso a la cámara','err');
  }
}

if(!SESSION){
  setStatus('⚠️ QR inválido — regenera el código desde la app','err');
}else{
  initCamera();
}
</script>
</body>
</html>
