<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Carta Digital</title>
<style>
:root{
  --bg:#F8F7F4;--surface:#fff;--border:#E5E4E0;--text:#1C1B18;--muted:#6B6A65;
  --accent:#16A34A;--accent2:#15803D;--red:#DC2626;
  --sans:system-ui,-apple-system,sans-serif;--mono:'Courier New',monospace;
  --radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111;--surface:#1C1C1E;--border:#2C2C2E;--text:#F5F5F5;--muted:#8E8E93;}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:110px}

/* LOADING */
#cargando{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:16px;font-size:15px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ERROR */
#error-screen{display:none;min-height:100dvh;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center}
#error-screen .icon{font-size:56px}
#error-screen h2{font-size:20px;font-weight:700}
#error-screen p{font-size:14px;color:var(--muted);line-height:1.6}

/* HEADER */
.header{background:var(--accent);color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-nombre{font-size:20px;font-weight:800;letter-spacing:-.3px}
.header-sub{font-size:13px;opacity:.75;margin-top:2px}

/* CATEGORÍAS NAV */
.cat-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;gap:0;scrollbar-width:none;position:sticky;top:72px;z-index:99}
.cat-nav::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:12px 16px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:.15s;font-family:var(--sans)}
.cat-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* SECCIÓN */
.cat-section{padding:20px 16px 8px}
.cat-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* PRODUCTO */
.producto{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.producto:last-child{border-bottom:none}
.prod-ico{font-size:32px;width:44px;text-align:center;flex-shrink:0}
.prod-info{flex:1;min-width:0}
.prod-nombre{font-size:15px;font-weight:600;line-height:1.3}
.prod-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.prod-precio{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}
.prod-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ctrl-btn{width:32px;height:32px;border-radius:50%;border:none;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;font-family:var(--sans)}
.ctrl-btn.minus{background:var(--border);color:var(--text)}
.ctrl-btn.minus:active{background:var(--muted)}
.ctrl-btn.plus{background:var(--accent);color:#fff}
.ctrl-btn.plus:active{background:var(--accent2)}
.ctrl-qty{font-size:16px;font-weight:700;min-width:20px;text-align:center}

/* CARRITO BAR */
.carrito-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:none;z-index:200}
.carrito-bar.visible{display:block}
.carrito-btn{width:100%;padding:16px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.carrito-btn:active{background:var(--accent2)}
.carrito-btn-count{background:rgba(255,255,255,.25);border-radius:99px;padding:2px 10px;font-size:13px}

/* MODAL PEDIDO */
#pedido-screen{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center}
#pedido-screen.open{display:flex}
.pedido-card{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-height:90dvh;overflow-y:auto;padding:20px 16px 32px}
.pedido-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.pedido-title{font-size:18px;font-weight:800;margin-bottom:16px}
.pedido-items{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.ped-item{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ped-item-nombre{flex:1}
.ped-item-qty{color:var(--muted);margin-right:8px;font-size:13px}
.ped-item-precio{font-weight:600;font-family:var(--mono)}
.pedido-sep{border:none;border-top:1px solid var(--border);margin:12px 0}
.pedido-total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin-bottom:20px}
.mesa-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.mesa-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--sans);background:var(--bg);color:var(--text);outline:none;margin-bottom:16px}
.mesa-input:focus{border-color:var(--accent)}
.btn-confirmar{width:100%;padding:16px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.btn-confirmar:disabled{background:var(--muted);cursor:not-allowed}
.btn-cancelar{width:100%;padding:12px;border-radius:14px;background:none;color:var(--muted);border:none;font-size:14px;cursor:pointer;font-family:var(--sans);margin-top:8px}

/* CONFIRMACIÓN */
#confirmacion-screen{display:none;min-height:100dvh;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:32px;text-align:center}
#confirmacion-screen.visible{display:flex}
.conf-icon{font-size:72px}
.conf-title{font-size:24px;font-weight:800}
.conf-sub{font-size:15px;color:var(--muted);line-height:1.6}
.btn-nuevo-pedido{margin-top:12px;padding:14px 32px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans)}

/* TOAST */
#toast-carta{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#1C1B18;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#toast-carta.show{opacity:1}
</style>
</head>
<body>

<div id="cargando">
  <div class="spinner"></div>
  <span>Cargando carta…</span>
</div>

<div id="error-screen">
  <div class="icon">😕</div>
  <h2>Carta no disponible</h2>
  <p id="error-msg">No hemos podido cargar la carta.<br>Inténtalo de nuevo en unos instantes.</p>
</div>

<div id="carta-screen" style="display:none">
  <div class="header">
    <div class="header-nombre" id="hdr-nombre">Mi Comercio</div>
    <div class="header-sub" id="hdr-sub">Carta digital · Toca para añadir</div>
  </div>
  <nav class="cat-nav" id="cat-nav"></nav>
  <main id="carta-main"></main>
</div>

<div class="carrito-bar" id="carrito-bar">
  <button class="carrito-btn" onclick="abrirPedido()">
    <span>🛒 Ver pedido</span>
    <span class="carrito-btn-count" id="carrito-count">0 artículos</span>
    <span id="carrito-total-btn">0,00 €</span>
  </button>
</div>

<div id="pedido-screen">
  <div class="pedido-card">
    <div class="pedido-handle"></div>
    <div class="pedido-title">Tu pedido</div>
    <div class="pedido-items" id="ped-items-list"></div>
    <hr class="pedido-sep">
    <div class="pedido-total">
      <span>Total</span>
      <span id="ped-total">0,00 €</span>
    </div>
    <div id="mesa-wrap">
      <div class="mesa-label">¿Cuál es tu mesa o tu nombre?</div>
      <input class="mesa-input" id="mesa-input" type="text" placeholder="Ej: Mesa 3 · Bar · Ana" maxlength="50" autocomplete="off">
    </div>
    <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarPedido()">Confirmar pedido</button>
    <button class="btn-cancelar" onclick="cerrarPedido()">← Seguir eligiendo</button>
  </div>
</div>

<div id="confirmacion-screen">
  <div class="conf-icon">✅</div>
  <div class="conf-title">¡Pedido enviado!</div>
  <div class="conf-sub" id="conf-sub">En breve te lo preparamos.<br>¡Gracias!</div>
  <button class="btn-nuevo-pedido" onclick="nuevoPedido()">Hacer otro pedido</button>
</div>

<div id="toast-carta"></div>

<script>
const SB_URL='https://aqbdlvmfbdagypmwxhca.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxYmRsdm1mYmRhZ3lwbXd4aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODM0NjIsImV4cCI6MjEwMzE1OTQ2Mn0.14wGoy4AQXhu9ZBTz4IAKBUXvRqveQZ1z-OKAMjm4gE';
const qp=new URLSearchParams(location.search);
const LICENCIA_ID=qp.get('lic')||'';
const MESA_URL=qp.get('mesa')||'';

let productos=[];
let comercioData={};
let carrito={};// {productoId: cantidad}

function fmt(v){return Number(v||0).toFixed(2).replace('.',',');}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function toast(msg,ms=2500){
  const t=document.getElementById('toast-carta');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

async function init(){
  if(!LICENCIA_ID){mostrarError('Código de carta inválido.');return;}
  try{
    const r=await fetch(
      SB_URL+'/rest/v1/sincronizaciones?licencia_id=eq.'+encodeURIComponent(LICENCIA_ID)+'&select=datos&limit=1',
      {headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY}}
    );
    if(!r.ok) throw new Error('http '+r.status);
    const d=await r.json();
    if(!d.length||!d[0].datos){mostrarError('Esta carta aún no tiene productos configurados.');return;}
    const sd=d[0].datos;
    comercioData=sd.comercio||{};
    productos=(sd.productos||[]).filter(p=>p.precio&&p.precio>0);
    if(!productos.length){mostrarError('Esta carta aún no tiene productos configurados.');return;}
    renderCarta();
  }catch(e){
    mostrarError('No pudimos cargar la carta. Comprueba tu conexión e inténtalo de nuevo.');
  }
}

function mostrarError(msg){
  document.getElementById('cargando').style.display='none';
  document.getElementById('error-msg').innerHTML=msg;
  document.getElementById('error-screen').style.display='flex';
}

function renderCarta(){
  document.getElementById('cargando').style.display='none';
  document.getElementById('carta-screen').style.display='block';
  document.getElementById('hdr-nombre').textContent=comercioData.nombre||'Carta digital';
  if(MESA_URL) document.getElementById('hdr-sub').textContent='📍 '+MESA_URL+' · Toca para añadir';

  // Agrupar por categoría
  const catMap=new Map();
  for(const p of productos){
    const cat=p.categoria||'Otros';
    if(!catMap.has(cat)) catMap.set(cat,[]);
    catMap.get(cat).push(p);
  }

  // Nav categorías
  const nav=document.getElementById('cat-nav');
  const main=document.getElementById('carta-main');
  nav.innerHTML='';main.innerHTML='';

  let first=true;
  for(const [cat,prods] of catMap){
    const catId='cat-'+cat.replace(/[^a-z0-9]/gi,'_');

    const btn=document.createElement('button');
    btn.className='cat-btn'+(first?' active':'');
    btn.textContent=cat;
    btn.onclick=()=>{
      document.getElementById(catId)?.scrollIntoView({behavior:'smooth',block:'start'});
    };
    nav.appendChild(btn);

    const sec=document.createElement('section');
    sec.className='cat-section';
    sec.id=catId;
    sec.innerHTML=`<div class="cat-title">${esc(cat)}</div>`+
      prods.map(p=>`
        <div class="producto" id="prod-${p.id}">
          <div class="prod-ico">${p.emoji||'📦'}</div>
          <div class="prod-info">
            <div class="prod-nombre">${esc(p.nombre)}</div>
            ${p.descripcion?`<div class="prod-desc">${esc(p.descripcion)}</div>`:''}
            <div class="prod-precio">${fmt(p.precio)} €</div>
          </div>
          <div class="prod-ctrl">
            <button class="ctrl-btn minus" onclick="quitarUno('${p.id}')" style="display:none" id="minus-${p.id}">−</button>
            <div class="ctrl-qty" id="qty-${p.id}" style="display:none">0</div>
            <button class="ctrl-btn plus" onclick="añadirUno('${p.id}')">+</button>
          </div>
        </div>`).join('');
    main.appendChild(sec);
    first=false;
  }

  // Scroll spy para nav
  const secciones=[...main.querySelectorAll('.cat-section')];
  const navBtns=[...nav.querySelectorAll('.cat-btn')];
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const idx=secciones.indexOf(e.target);
        navBtns.forEach((b,i)=>b.classList.toggle('active',i===idx));
        navBtns[idx]?.scrollIntoView({inline:'center',block:'nearest'});
      }
    });
  },{threshold:.3,rootMargin:'-120px 0px -60% 0px'});
  secciones.forEach(s=>obs.observe(s));
}

function añadirUno(id){
  carrito[id]=(carrito[id]||0)+1;
  actualizarProductoUI(id);
  actualizarCarritoBar();
}

function quitarUno(id){
  if((carrito[id]||0)>0) carrito[id]--;
  if(!carrito[id]) delete carrito[id];
  actualizarProductoUI(id);
  actualizarCarritoBar();
}

function actualizarProductoUI(id){
  const qty=carrito[id]||0;
  const qtyEl=document.getElementById('qty-'+id);
  const minusEl=document.getElementById('minus-'+id);
  if(qtyEl){qtyEl.textContent=qty;qtyEl.style.display=qty?'':'none';}
  if(minusEl) minusEl.style.display=qty?'':'none';
}

function actualizarCarritoBar(){
  const bar=document.getElementById('carrito-bar');
  const entries=Object.entries(carrito);
  const totalItems=entries.reduce((s,[,q])=>s+q,0);
  const totalEur=entries.reduce((s,[id,q])=>{
    const p=productos.find(x=>x.id===id);
    return s+(p?p.precio*q:0);
  },0);
  if(totalItems>0){
    bar.classList.add('visible');
    document.getElementById('carrito-count').textContent=totalItems+' artículo'+(totalItems!==1?'s':'');
    document.getElementById('carrito-total-btn').textContent=fmt(totalEur)+' €';
  } else {
    bar.classList.remove('visible');
  }
}

function abrirPedido(){
  const entries=Object.entries(carrito).filter(([,q])=>q>0);
  if(!entries.length) return;

  // Renderizar lista
  const itemsHtml=entries.map(([id,q])=>{
    const p=productos.find(x=>x.id===id);if(!p) return '';
    return `<div class="ped-item">
      <span class="prod-ico" style="font-size:20px;width:28px">${p.emoji||'📦'}</span>
      <span class="ped-item-nombre">${esc(p.nombre)}</span>
      <span class="ped-item-qty">×${q}</span>
      <span class="ped-item-precio">${fmt(p.precio*q)} €</span>
    </div>`;
  }).join('');
  document.getElementById('ped-items-list').innerHTML=itemsHtml;

  const total=entries.reduce((s,[id,q])=>{
    const p=productos.find(x=>x.id===id);return s+(p?p.precio*q:0);
  },0);
  document.getElementById('ped-total').textContent=fmt(total)+' €';

  // Si la mesa viene por URL, ocultamos el input
  const mesaWrap=document.getElementById('mesa-wrap');
  if(MESA_URL){
    mesaWrap.style.display='none';
  } else {
    mesaWrap.style.display='block';
  }

  document.getElementById('pedido-screen').classList.add('open');
}

function cerrarPedido(){
  document.getElementById('pedido-screen').classList.remove('open');
}

async function confirmarPedido(){
  const mesa=MESA_URL||(document.getElementById('mesa-input')?.value||'').trim();
  if(!mesa){toast('⚠️ Escribe tu nombre o número de mesa');return;}

  const btn=document.getElementById('btn-confirmar');
  btn.disabled=true;btn.textContent='Enviando…';

  const items=Object.entries(carrito).filter(([,q])=>q>0).map(([id,q])=>{
    const p=productos.find(x=>x.id===id);
    return {productoId:p.id,nombre:p.nombre,emoji:p.emoji||'📦',precio:p.precio,unidad:p.unidad||'ud',cantidad:q};
  });
  const total=items.reduce((s,i)=>s+i.precio*i.cantidad,0);

  try{
    const r=await fetch(SB_URL+'/rest/v1/pedidos_qr',{
      method:'POST',
      headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({licencia_id:LICENCIA_ID,mesa,items,total})
    });
    if(!r.ok) throw new Error('http '+r.status);

    // Confirmación
    document.getElementById('pedido-screen').classList.remove('open');
    document.getElementById('carta-screen').style.display='none';
    document.getElementById('carrito-bar').classList.remove('visible');
    const confSub=document.getElementById('conf-sub');
    confSub.innerHTML='<strong>'+esc(mesa)+'</strong> — en breve te lo preparamos.<br>¡Gracias!';
    document.getElementById('confirmacion-screen').classList.add('visible');
  }catch(e){
    btn.disabled=false;btn.textContent='Confirmar pedido';
    toast('❌ Error al enviar. Inténtalo de nuevo.',3000);
  }
}

function nuevoPedido(){
  carrito={};
  document.getElementById('mesa-input').value='';
  document.getElementById('confirmacion-screen').classList.remove('visible');
  document.getElementById('carta-screen').style.display='block';
  // Reset UI
  productos.forEach(p=>{
    const qtyEl=document.getElementById('qty-'+p.id);
    const minusEl=document.getElementById('minus-'+p.id);
    if(qtyEl){qtyEl.textContent='0';qtyEl.style.display='none';}
    if(minusEl) minusEl.style.display='none';
  });
  actualizarCarritoBar();
}

init();
</script>
</body>
</html>
