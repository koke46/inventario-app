<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Miarma — Visor Cliente</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1f2e; --border: #2a2f42;
    --text: #e8eaf0; --muted: #6b7280; --green: #10b981;
    --amber: #f59e0b; --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px;
  }
  .logo {
    font-size: 48px; margin-bottom: 8px;
  }
  .negocio-nombre {
    font-size: 22px; font-weight: 800; color: var(--amber);
    margin-bottom: 24px; text-align: center;
    letter-spacing: 1px;
  }
  .pedido-box {
    width: 100%; max-width: 460px;
    background: var(--surface); border-radius: 16px;
    border: 1px solid var(--border); padding: 20px;
  }
  .pedido-titulo {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); margin-bottom: 12px;
  }
  .item-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-nombre { flex: 1; }
  .item-qty {
    font-family: var(--mono); color: var(--muted);
    font-size: 13px; margin: 0 12px;
  }
  .item-precio {
    font-family: var(--mono); font-weight: 700;
    color: var(--text);
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0 2px; margin-top: 8px;
    border-top: 2px solid var(--border);
  }
  .total-label { font-size: 18px; font-weight: 700; }
  .total-valor {
    font-size: 32px; font-weight: 900;
    font-family: var(--mono); color: var(--green);
  }
  .vacio {
    text-align: center; padding: 40px 20px;
    color: var(--muted); font-size: 15px;
  }
  .vacio .ico { font-size: 48px; margin-bottom: 12px; }
  .footer {
    margin-top: 24px; font-size: 12px; color: var(--muted);
    text-align: center;
  }
  .desc-badge {
    font-size: 12px; color: var(--amber);
    background: rgba(245,158,11,.12); border-radius: 6px;
    padding: 2px 7px; margin-top: 4px; display: inline-block;
  }
</style>
</head>
<body>
<div class="logo" id="logo">🍺</div>
<div class="negocio-nombre" id="negocio-nombre">El Miarma</div>
<div class="pedido-box">
  <div class="pedido-titulo">Tu pedido</div>
  <div id="items-list"><div class="vacio"><div class="ico">🛒</div>Esperando pedido…</div></div>
  <div class="total-row" id="total-row" style="display:none">
    <span class="total-label">Total</span>
    <span class="total-valor" id="total-val">0,00 €</span>
  </div>
</div>
<div class="footer" id="footer">Actualizado en tiempo real</div>

<script>
  const KEY_VISOR = 'if_visor_pedido';
  function fmt(v) { return (v||0).toFixed(2).replace('.',',') + ' €'; }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function render() {
    try {
      const raw = localStorage.getItem(KEY_VISOR);
      if (!raw) return;
      const data = JSON.parse(raw);
      // Nombre negocio
      if (data.negocio) {
        document.getElementById('negocio-nombre').textContent = data.negocio;
        document.title = 'Visor · ' + data.negocio;
      }
      // Mesa
      const titulo = document.querySelector('.pedido-titulo');
      if (titulo) titulo.textContent = data.mesa ? 'Mesa: ' + data.mesa : 'Tu pedido';
      // Items
      const list = document.getElementById('items-list');
      const totalRow = document.getElementById('total-row');
      const totalVal = document.getElementById('total-val');
      if (!data.items || !data.items.length) {
        list.innerHTML = '<div class="vacio"><div class="ico">🛒</div>Pedido vacío</div>';
        totalRow.style.display = 'none';
        return;
      }
      list.innerHTML = data.items.map(it => {
        const sub = (it.precio||0) * (it.cantidad||1);
        const descBadge = it.descuentoLinea ? `<div><span class="desc-badge">-${it.descuentoLinea}%</span></div>` : '';
        return `<div class="item-row">
          <div class="item-nombre">${esc(it.nombre)}${it.variante?' <span style="color:var(--muted);font-size:13px">('+esc(it.variante)+')</span>':''}${descBadge}</div>
          <span class="item-qty">${it.cantidad}x</span>
          <span class="item-precio">${fmt(sub)}</span>
        </div>`;
      }).join('');
      totalRow.style.display = '';
      totalVal.textContent = fmt(data.total);
      if (data.descuento) {
        totalVal.title = 'Descuento aplicado: ' + fmt(data.descuento);
      }
    } catch(e) {}
  }
  // Poll + storage event
  render();
  window.addEventListener('storage', e => { if (e.key === KEY_VISOR) render(); });
  setInterval(render, 1500);
</script>
</body>
</html>
