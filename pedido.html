<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hacer pedido</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #16a34a; --green2: #15803d;
      --wa: #25D366; --wa2: #1da851;
      --bg: #f1f5f9; --surface: #fff;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

    /* HEADER */
    #hdr { background: var(--green); color: #fff; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
    #hdr h1 { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
    #hdr p  { font-size: 12px; opacity: .82; margin-top: 2px; }

    /* FAMILIA TABS */
    #fam-bar { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 61px; z-index: 9; scrollbar-width: none; }
    #fam-bar::-webkit-scrollbar { display: none; }
    .f-tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 2px solid var(--border); background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; font-family: inherit; transition: background .12s; }
    .f-tab.on { background: var(--green); border-color: var(--green); color: #fff; }

    /* PRODUCTOS */
    #prod-list { padding: 12px 14px 140px; }
    .p-card { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .p-ico  { font-size: 34px; min-width: 46px; text-align: center; line-height: 1; }
    .p-info { flex: 1; min-width: 0; }
    .p-nom  { font-weight: 600; font-size: 15px; line-height: 1.2; }
    .p-prec { color: var(--green); font-weight: 700; font-size: 14px; margin-top: 3px; }
    .p-qty  { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .q-btn  { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); background: transparent; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); line-height: 1; font-family: inherit; }
    .q-btn.plus { background: var(--green); border-color: var(--green); color: #fff; }
    .q-btn.minus-on { border-color: #ef4444; color: #ef4444; }
    .q-num  { min-width: 22px; text-align: center; font-weight: 700; font-size: 16px; }

    /* CARRITO */
    #cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 2px solid var(--border); z-index: 20; transition: transform .2s; }
    #cart-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px; }
    #cart-open { display: none; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
    #cart-open.show { display: flex; }
    #cart-row { display: flex; justify-content: space-between; align-items: center; }
    #cart-n   { font-size: 13px; color: var(--muted); }
    #cart-tot { font-size: 20px; font-weight: 800; }
    #nota     { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--text); }
    #nota:focus { outline: none; border-color: var(--green); }
    #btn-wa   { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; background: var(--wa); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; width: 100%; }
    #btn-wa:active { background: var(--wa2); }

    /* ERROR */
    #error-box { display: none; text-align: center; padding: 60px 24px; }
    #error-box .e-ico { font-size: 56px; margin-bottom: 14px; }
    #error-box h2 { font-size: 18px; margin-bottom: 8px; }
    #error-box p  { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>

<div id="hdr">
  <h1 id="h-nom">Cargando…</h1>
  <p id="h-sub">Selecciona lo que quieres pedir</p>
</div>

<div id="fam-bar"></div>
<div id="prod-list"></div>

<div id="cart-bar">
  <div id="cart-empty">🛒 Añade productos para hacer tu pedido</div>
  <div id="cart-open">
    <div id="cart-row">
      <span id="cart-n"></span>
      <span id="cart-tot"></span>
    </div>
    <input id="nota" type="text" placeholder="📝 Nota: sin cebolla, extra queso…">
    <button id="btn-wa" onclick="enviarWA()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Enviar pedido por WhatsApp
    </button>
  </div>
</div>

<div id="error-box">
  <div class="e-ico">📲</div>
  <h2>Escanea el código QR</h2>
  <p>Pide al establecimiento el código QR para ver la carta y hacer tu pedido.</p>
</div>

<script>
let M = null;       // menu data
let cart = {};      // { codigo: qty }
let famSel = null;

function fmt(v) { return v.toFixed(2).replace('.', ',') + ' €'; }

function init() {
  const hash = location.hash.replace(/^#/, '');
  if (hash) {
    try { M = JSON.parse(decodeURIComponent(escape(atob(hash)))); }
    catch(e) { M = null; }
  }
  if (M && M.p) { start(); return; }
  // Sin hash: intentar cargar menu.json del mismo servidor
  fetch('menu.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(d => { M = d; start(); })
    .catch(() => showError());
}

function start() {
  if (!M || !M.p) { showError(); return; }
  document.getElementById('h-nom').textContent = M.n || 'Hacer pedido';
  document.title = M.n ? M.n + ' — Pedido' : 'Hacer pedido';
  renderFams();
  if (M.f && M.f.length) selFam(0);
}

function showError() {
  document.getElementById('hdr').style.display = 'none';
  document.getElementById('fam-bar').style.display = 'none';
  document.getElementById('cart-bar').style.display = 'none';
  document.getElementById('error-box').style.display = 'block';
}

function renderFams() {
  document.getElementById('fam-bar').innerHTML = (M.f || []).map((f,i) =>
    `<button class="f-tab${famSel===i?' on':''}" onclick="selFam(${i})">${f.e||''} ${f.n}</button>`
  ).join('');
}

function selFam(idx) {
  famSel = idx;
  renderFams();
  const prods = (M.p || []).filter(p => p.f === idx);
  const el = document.getElementById('prod-list');
  if (!prods.length) {
    el.innerHTML = '<div style="text-align:center;color:#888;padding:50px 20px;font-size:15px">Sin productos en esta categoría</div>';
    return;
  }
  el.innerHTML = prods.map(p => {
    const q = cart[p.i] || 0;
    return `<div class="p-card">
      <div class="p-ico">📦</div>
      <div class="p-info">
        <div class="p-nom">${p.n}</div>
        <div class="p-prec">${fmt(p.pr)}</div>
      </div>
      <div class="p-qty">
        <button class="q-btn${q>0?' minus-on':''}" onclick="chgQty('${p.i}',-1)">−</button>
        <span class="q-num" id="qn-${p.i}">${q}</span>
        <button class="q-btn plus" onclick="chgQty('${p.i}',1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function chgQty(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  const el = document.getElementById('qn-' + id);
  if (el) el.textContent = cart[id];
  const btn = el ? el.previousElementSibling : null;
  if (btn) btn.className = 'q-btn' + (cart[id] > 0 ? ' minus-on' : '');
  updCart();
}

function updCart() {
  const items = Object.entries(cart).filter(([,q]) => q > 0);
  const empty = document.getElementById('cart-empty');
  const open  = document.getElementById('cart-open');
  if (!items.length) { empty.style.display = ''; open.classList.remove('show'); return; }
  empty.style.display = 'none';
  open.classList.add('show');
  let totQ = 0, totP = 0;
  items.forEach(([id, q]) => {
    const p = (M.p || []).find(x => x.i === id);
    if (p) { totQ += q; totP += p.pr * q; }
  });
  document.getElementById('cart-n').textContent = totQ + ' artículo' + (totQ > 1 ? 's' : '');
  document.getElementById('cart-tot').textContent = fmt(totP);
}

function enviarWA() {
  const items = Object.entries(cart).filter(([,q]) => q > 0);
  if (!items.length) return;
  const lines = ['🛒 *PEDIDO*'];
  if (M.n) lines.push('📍 ' + M.n);
  lines.push('');
  let totP = 0;
  items.forEach(([id, q]) => {
    const p = (M.p || []).find(x => x.i === id);
    if (!p) return;
    const sub = p.pr * q;
    totP += sub;
    lines.push(`• ${q}× ${p.n}  (${fmt(sub)})`);
  });
  lines.push('');
  lines.push('*Total: ' + fmt(totP) + '*');
  const nota = document.getElementById('nota').value.trim();
  if (nota) lines.push('\n📝 ' + nota);
  const txt = lines.join('\n');
  const phone = (M.t || '').replace(/\D/g, '');
  const waUrl = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(txt)}`
    : `https://wa.me/?text=${encodeURIComponent(txt)}`;
  window.open(waUrl, '_blank');
}

init();
</script>
</body>
</html>
